name: Auto Merge TVBox Sources

on:
  schedule:
    - cron: '0 */3 * * *' # 每 3 小时自动抓取并合并一次
  workflow_dispatch:     # 支持手动点击立即执行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 执行合并脚本
        run: |
          python merge.py

      - name: 持久化缓存与最终配置
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/ merged.json
          git diff --staged --quiet || (git commit -m "Auto merge and update TVBox cache" && git push)
